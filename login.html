<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 1rem 2rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 20px;
      padding: 2.5rem 2rem;
    }

    .logo {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: -.02em;
      display: block;
      margin-bottom: 2rem;
    }
    .logo span { color: #3b82f6; }

    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: .35rem; letter-spacing: -.02em; }
    .sub { font-size: .875rem; color: #666; margin-bottom: 2rem; }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: #666;
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: .75rem 1rem;
      font-size: .9rem;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #333; }

    .btn {
      width: 100%;
      padding: .82rem;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      margin-top: .25rem;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }

    .forgot {
      text-align: right;
      margin-top: .5rem;
      margin-bottom: 1.5rem;
    }
    .forgot a { font-size: .8rem; color: #555; text-decoration: none; }
    .forgot a:hover { color: #888; }

    .error-box, .info-box {
      border-radius: 9px;
      padding: .75rem 1rem;
      font-size: .85rem;
      margin-bottom: 1.1rem;
      display: none;
    }
    .error-box { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); color: #f87171; }
    .info-box  { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.25); color: #93c5fd; }

    .footer-links {
      margin-top: 1.75rem;
      text-align: center;
      font-size: .8rem;
      color: #444;
    }
    .footer-links a { color: #555; text-decoration: none; }
    .footer-links a:hover { color: #888; }
  </style>
</head>
<body data-page="auth-page">

  <!-- ─── Navbar ─────────────────────────────────────────── -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">Loop <span class="accent">&amp;</span> Convert</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li class="nav-cta"><a href="book.html" class="btn btn-primary">Book a Call</a></li>
        </ul>
      </nav>
      <button class="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="book.html" class="btn btn-primary">Book a Call</a>
    </div>
  </header>

  <div class="login-wrap">
  <div class="card">
    <a href="index.html" class="logo">Loop <span>&amp;</span> Convert</a>

    <h1>Welcome back</h1>
    <p class="sub">Sign in to your firm's account</p>

    <div class="error-box" id="err"></div>
    <div class="info-box"  id="info"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@yourfirm.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Sign In</button>
    </form>

    <div class="footer-links">
      Don't have an account? Contact your firm admin.
    </div>
  </div>
  </div>

  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    var form    = document.getElementById('login-form');
    var errBox  = document.getElementById('err');
    var infoBox = document.getElementById('info');
    var btn     = document.getElementById('submit-btn');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = 'block';
      infoBox.style.display = 'none';
    }

    function showInfo(msg) {
      infoBox.textContent = msg;
      infoBox.style.display = 'block';
      errBox.style.display = 'none';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.style.display = 'none';

      var email    = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) return showError('Please enter your email and password.');

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      var res = await LC_AUTH.signIn(email, password);

      if (res.error) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        var msg = res.error.message;
        if (msg.includes('Invalid login credentials')) msg = 'Incorrect email or password.';
        if (msg.includes('Email not confirmed'))       msg = 'Please check your email to confirm your account first.';
        return showError(msg);
      }

      // Check profile exists (no profile = no invitation)
      showInfo('Signing in…');
      var profile = await LC_AUTH.getProfile();
      if (!profile) {
        await LC_AUTH.supabase.auth.signOut();
        return showError('No account found for this email. Ask your firm admin to invite you.');
      }

      window.location.href = LC_AUTH.dashboardUrl(profile.role);
    });
  </script>
</body>
</html>
