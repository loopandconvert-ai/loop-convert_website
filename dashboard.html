<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .nav {
      position: sticky; top: 0; z-index: 40;
      background: rgba(10,10,10,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1e1e1e;
      padding: 0 2rem;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      height: 58px;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .nav-logo {
      font-size: .95rem; font-weight: 800; color: #fff;
      text-decoration: none; letter-spacing: -.02em; flex-shrink: 0;
    }
    .nav-logo span { color: #60a5fa; }
    .nav-right { display: flex; align-items: center; gap: .75rem; }
    .nav-email { font-size: .8rem; color: #555; }
    .nav-upload {
      padding: .45rem 1rem; font-size: .82rem; font-weight: 600;
      background: #fff; color: #000; border-radius: 7px;
      text-decoration: none; border: none; cursor: pointer;
      font-family: inherit; transition: opacity .15s;
    }
    .nav-upload:hover { opacity: .85; }
    .btn-signout {
      padding: .45rem .9rem; font-size: .82rem; font-weight: 500;
      background: none; color: #666; border: 1px solid #222;
      border-radius: 7px; cursor: pointer; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .btn-signout:hover { color: #ccc; border-color: #444; }

    /* ── Page wrapper ── */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

    /* ── Welcome ── */
    .welcome { margin-bottom: 2rem; }
    .welcome h1 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: .3rem; }
    .welcome p  { font-size: .875rem; color: #555; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    .stat {
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 12px; padding: 1.25rem 1.5rem;
    }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1; margin-bottom: .3rem; }
    .stat-lbl { font-size: .78rem; color: #555; font-weight: 500; }
    .stat-val.red    { color: #f87171; }
    .stat-val.green  { color: #4ade80; }

    /* ── Table card ── */
    .card { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; overflow: hidden; }

    .toolbar {
      display: flex; align-items: center; gap: .75rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap;
    }
    .search {
      display: flex; align-items: center; gap: .5rem;
      background: #0e0e0e; border: 1px solid #1e1e1e;
      border-radius: 8px; padding: .45rem .75rem; flex: 1; min-width: 180px;
    }
    .search svg { color: #444; flex-shrink: 0; }
    .search input {
      background: none; border: none; outline: none;
      color: #fff; font-size: .85rem; font-family: inherit; width: 100%;
    }
    .search input::placeholder { color: #444; }

    .filter-btns { display: flex; gap: .3rem; }
    .fbtn {
      padding: .35rem .8rem; font-size: .78rem; font-weight: 600;
      border-radius: 6px; border: 1px solid #222; background: none;
      color: #666; cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .fbtn:hover { border-color: #333; color: #aaa; }
    .fbtn.on { background: #fff; color: #000; border-color: #fff; }
    .fbtn.on.red    { background: #f87171; border-color: #f87171; }
    .fbtn.on.amber  { background: #fbbf24; border-color: #fbbf24; }
    .fbtn.on.green  { background: #4ade80; border-color: #4ade80; }

    .tbl-head {
      display: grid; grid-template-columns: 1fr 120px 130px 70px;
      padding: .6rem 1.25rem; border-bottom: 1px solid #1a1a1a;
    }
    .tbl-head span { font-size: .7rem; font-weight: 600; color: #3a3a3a; text-transform: uppercase; letter-spacing: .08em; }

    .row {
      display: grid; grid-template-columns: 1fr 120px 130px 70px;
      align-items: center; padding: .85rem 1.25rem;
      border-bottom: 1px solid #141414; cursor: pointer;
      transition: background .12s; text-decoration: none;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: #161616; }

    .row-name { display: flex; align-items: center; gap: .7rem; min-width: 0; }
    .file-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: #1a1a1a; border: 1px solid #242424;
      display: flex; align-items: center; justify-content: center;
      font-size: .58rem; font-weight: 700; color: #555; flex-shrink: 0;
    }
    .file-name { font-size: .875rem; font-weight: 500; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .7rem; font-weight: 700; padding: .22rem .6rem;
      border-radius: 999px; letter-spacing: .04em; text-transform: uppercase;
    }
    .badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
    .b-high   { background:rgba(248,113,113,.12); color:#f87171; }
    .b-medium { background:rgba(251,191,36,.12);  color:#fbbf24; }
    .b-low    { background:rgba(74,222,128,.12);  color:#4ade80; }

    .row-date { font-size: .78rem; color: #444; }
    .row-link { font-size: .78rem; font-weight: 600; color: #555; transition: color .12s; }
    .row:hover .row-link { color: #fff; }

    /* ── Empty / loading states ── */
    .state {
      padding: 4rem 2rem; text-align: center; color: #444;
    }
    .state h3 { font-size: 1rem; color: #666; margin-bottom: .5rem; }
    .state p  { font-size: .875rem; margin-bottom: 1.5rem; }
    .btn-primary {
      display: inline-block; padding: .65rem 1.4rem;
      background: #fff; color: #000; font-size: .875rem; font-weight: 700;
      border-radius: 8px; text-decoration: none; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .85; }

    @media (max-width: 640px) {
      .nav { padding: 0 1rem; }
      .nav-email { display: none; }
      .wrap { padding: 1.5rem 1rem 4rem; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stats .stat:last-child { display: none; }
      .tbl-head, .row { grid-template-columns: 1fr 90px; }
      .tbl-head span:nth-child(3), .tbl-head span:nth-child(4),
      .row > *:nth-child(3), .row > *:nth-child(4) { display: none; }
    }
  </style>
</head>
<body data-page="auth-required">

  <!-- Navbar -->
  <header class="nav">
    <div class="nav-inner">
      <a href="dashboard.html" class="nav-logo">Loop <span>&amp;</span> Convert</a>
      <div class="nav-right">
        <span class="nav-email" id="nav-email"></span>
        <a href="upload-pro.html" class="nav-upload">+ Upload contract</a>
        <button class="btn-signout" id="btn-signout">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <div class="wrap">

    <div class="welcome">
      <h1 id="welcome-title">Contract Dashboard</h1>
      <p id="welcome-sub">Your analyzed contracts</p>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="s-total">—</div>
        <div class="stat-lbl">Contracts analyzed</div>
      </div>
      <div class="stat">
        <div class="stat-val red" id="s-high">—</div>
        <div class="stat-lbl">High risk</div>
      </div>
      <div class="stat">
        <div class="stat-val green" id="s-hours">—</div>
        <div class="stat-lbl">Hours saved</div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="toolbar">
        <div class="search">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" id="search-input" placeholder="Search contracts…" />
        </div>
        <div class="filter-btns">
          <button class="fbtn on" data-f="all">All</button>
          <button class="fbtn red"   data-f="High">High</button>
          <button class="fbtn amber" data-f="Medium">Medium</button>
          <button class="fbtn green" data-f="Low">Low</button>
        </div>
      </div>

      <div class="tbl-head">
        <span>Document</span>
        <span>Risk</span>
        <span>Date</span>
        <span></span>
      </div>

      <div id="rows">
        <div class="state"><p style="color:#444;">Loading…</p></div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
  (function () {
    var all = [];
    var filter = 'all';
    var query  = '';

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }
    function badgeClass(r) {
      return r === 'High' ? 'b-high' : r === 'Medium' ? 'b-medium' : 'b-low';
    }

    function render() {
      var list = all.slice();
      if (query) list = list.filter(function(d){ return d.file_name.toLowerCase().indexOf(query) !== -1; });
      if (filter !== 'all') list = list.filter(function(d){ return d.risk_level === filter; });

      var rows = document.getElementById('rows');

      if (all.length === 0) {
        rows.innerHTML =
          '<div class="state">' +
          '<h3>No contracts yet</h3>' +
          '<p>Upload your first contract and get an AI analysis in under 3 minutes.</p>' +
          '<a href="upload-pro.html" class="btn-primary">Upload a contract</a>' +
          '</div>';
        return;
      }

      if (list.length === 0) {
        rows.innerHTML = '<div class="state"><h3>No results</h3><p>No contracts match your filter.</p></div>';
        return;
      }

      rows.innerHTML = list.map(function(d) {
        return '<a class="row" href="analysis.html?id=' + esc(d.id) + '">' +
          '<div class="row-name">' +
            '<div class="file-icon">PDF</div>' +
            '<span class="file-name">' + esc(d.file_name || 'Untitled') + '</span>' +
          '</div>' +
          '<div><span class="badge ' + badgeClass(d.risk_level) + '">' + esc(d.risk_level || '—') + '</span></div>' +
          '<div class="row-date">' + fmtDate(d.analyzed_at) + '</div>' +
          '<div class="row-link">View →</div>' +
        '</a>';
      }).join('');
    }

    function setStats(docs) {
      var high  = docs.filter(function(d){ return d.risk_level === 'High'; }).length;
      var hours = (docs.length * 2.5).toFixed(1).replace('.0','');
      document.getElementById('s-total').textContent = docs.length;
      document.getElementById('s-high').textContent  = high;
      document.getElementById('s-hours').textContent = hours + 'h';
    }

    // Filter buttons
    document.querySelectorAll('.fbtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        filter = btn.dataset.f;
        render();
      });
    });

    // Search
    document.getElementById('search-input').addEventListener('input', function() {
      query = this.value.trim().toLowerCase();
      render();
    });

    // Sign out
    document.getElementById('btn-signout').addEventListener('click', function() {
      if (window.LC_AUTH) window.LC_AUTH.signOut();
    });

    // Load data once session is confirmed
    document.addEventListener('lc:session', function(e) {
      var session = e.detail;
      if (!session) return;

      var meta      = session.user.user_metadata || {};
      var firstName = (meta.full_name || session.user.email).split(' ')[0];
      document.getElementById('welcome-title').textContent = 'Welcome back, ' + firstName;
      document.getElementById('welcome-sub').textContent   = session.user.email;
      document.getElementById('nav-email').textContent     = session.user.email;

      // Load analyses from Supabase
      window.LC_AUTH.loadAnalyses().then(function(res) {
        if (res.error || !res.data) {
          document.getElementById('rows').innerHTML =
            '<div class="state"><h3>Could not load contracts</h3><p>' + (res.error ? res.error.message : 'Unknown error') + '</p></div>';
          return;
        }
        all = res.data;
        setStats(all);
        render();
      });
    });
  })();
  </script>

</body>
</html>
