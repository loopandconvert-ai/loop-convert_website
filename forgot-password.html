<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--black);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid var(--grey-100);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
    }
    .auth-logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--white);
      text-decoration: none;
      display: block;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: .35rem;
    }
    .auth-sub {
      color: var(--grey-400);
      font-size: .9rem;
      margin-bottom: 2rem;
    }
    .auth-field { margin-bottom: 1rem; }
    .auth-field label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: var(--grey-200);
      margin-bottom: .4rem;
    }
    .auth-field input {
      width: 100%;
      background: #191919;
      border: 1px solid var(--grey-100);
      border-radius: var(--radius-md);
      padding: .7rem 1rem;
      color: var(--white);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .auth-field input:focus { border-color: var(--blue); }
    .auth-error {
      color: #f87171;
      font-size: .85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-success {
      color: #4ade80;
      font-size: .875rem;
      background: rgba(74,222,128,.08);
      border: 1px solid rgba(74,222,128,.2);
      border-radius: 8px;
      padding: .85rem 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-btn {
      width: 100%;
      text-align: center;
      margin-top: .5rem;
      padding: .75rem 1rem;
      font-size: .95rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--grey-400);
      font-size: .875rem;
    }
    .auth-footer a {
      color: var(--white);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">

      <a href="index.html" class="auth-logo">Loop <span class="accent">&amp;</span> Convert</a>

      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

      <div class="auth-error" id="fp-error"></div>
      <div class="auth-success" id="fp-success">
        Check your inbox — a reset link is on its way.
      </div>

      <form id="fp-form" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@lawfirm.com" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-primary auth-btn" id="fp-btn">Send reset link</button>
      </form>

      <p class="auth-footer" style="margin-top:1.25rem;">
        <a href="login.html">← Back to log in</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script>
  (function () {
    var cfg = window.LC_CONFIG;
    if (!cfg || cfg.supabaseUrl === 'YOUR_SUPABASE_URL') return;
    var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);

    var form    = document.getElementById('fp-form');
    var errBox  = document.getElementById('fp-error');
    var okBox   = document.getElementById('fp-success');
    var btn     = document.getElementById('fp-btn');

    function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
    function hideErr()    { errBox.style.display = 'none'; }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      hideErr();
      var email = document.getElementById('email').value.trim();
      if (!email) { showErr('Please enter your email address.'); return; }

      btn.textContent = 'Sending…';
      btn.disabled = true;

      var redirectTo = window.location.origin + '/reset-password.html';

      sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo })
        .then(function (res) {
          btn.textContent = 'Send reset link';
          btn.disabled = false;
          if (res.error) {
            showErr(res.error.message || 'Something went wrong. Please try again.');
          } else {
            form.style.display = 'none';
            okBox.style.display = 'block';
          }
        });
    });
  })();
  </script>

</body>
</html>
