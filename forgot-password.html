<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 20px;
      padding: 2.5rem 2rem;
    }
    .logo { font-size: 1rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -.02em; display: block; margin-bottom: 2rem; }
    .logo span { color: #3b82f6; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: .35rem; letter-spacing: -.02em; }
    .sub { font-size: .875rem; color: #666; margin-bottom: 2rem; line-height: 1.5; }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .75rem; font-weight: 600; color: #666; margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .08em; }
    input[type="email"] { width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 10px; padding: .75rem 1rem; font-size: .9rem; color: #fff; font-family: inherit; outline: none; transition: border-color .15s; }
    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #333; }
    .btn { width: 100%; padding: .82rem; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: opacity .15s; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .error-box, .success-box {
      border-radius: 9px;
      padding: .75rem 1rem;
      font-size: .85rem;
      margin-bottom: 1.1rem;
      display: none;
    }
    .error-box   { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.25);  color: #f87171; }
    .success-box { background: rgba(34,197,94,.08);  border: 1px solid rgba(34,197,94,.25);  color: #4ade80; }
    .back { margin-top: 1.5rem; text-align: center; font-size: .8rem; }
    .back a { color: #555; text-decoration: none; }
    .back a:hover { color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="logo">Loop <span>&amp;</span> Convert</a>

    <h1>Forgot password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset your password.</p>

    <div class="error-box"   id="err"></div>
    <div class="success-box" id="ok"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@yourfirm.com" autocomplete="email" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Send Reset Link</button>
    </form>

    <div class="back"><a href="login.html">← Back to sign in</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    var form   = document.getElementById('reset-form');
    var errBox = document.getElementById('err');
    var okBox  = document.getElementById('ok');
    var btn    = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.style.display = 'none';
      okBox.style.display  = 'none';

      var email = document.getElementById('email').value.trim();
      if (!email) {
        errBox.textContent = 'Please enter your email address.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';

      var res = await LC_AUTH.sendPasswordReset(email);

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      if (res.error) {
        errBox.textContent = res.error.message;
        errBox.style.display = 'block';
        return;
      }

      form.style.display = 'none';
      okBox.textContent = 'Check your inbox — we sent a reset link to ' + email + '. It expires in 1 hour.';
      okBox.style.display = 'block';
    });
  </script>
</body>
</html>
