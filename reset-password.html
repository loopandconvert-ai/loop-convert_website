<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--black);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid var(--grey-100);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
    }
    .auth-logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--white);
      text-decoration: none;
      display: block;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: .35rem;
    }
    .auth-sub {
      color: var(--grey-400);
      font-size: .9rem;
      margin-bottom: 2rem;
    }
    .auth-field { margin-bottom: 1rem; }
    .auth-field label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: var(--grey-200);
      margin-bottom: .4rem;
    }
    .auth-field input {
      width: 100%;
      background: #191919;
      border: 1px solid var(--grey-100);
      border-radius: var(--radius-md);
      padding: .7rem 1rem;
      color: var(--white);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .auth-field input:focus { border-color: var(--blue); }
    .auth-error {
      color: #f87171;
      font-size: .85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-success {
      color: #4ade80;
      font-size: .875rem;
      background: rgba(74,222,128,.08);
      border: 1px solid rgba(74,222,128,.2);
      border-radius: 8px;
      padding: .85rem 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-invalid {
      color: var(--grey-400);
      font-size: .9rem;
      text-align: center;
      padding: 1rem 0;
      display: none;
    }
    .auth-btn {
      width: 100%;
      text-align: center;
      margin-top: .5rem;
      padding: .75rem 1rem;
      font-size: .95rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--grey-400);
      font-size: .875rem;
    }
    .auth-footer a {
      color: var(--white);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">

      <a href="index.html" class="auth-logo">Loop <span class="accent">&amp;</span> Convert</a>

      <div class="auth-invalid" id="rp-invalid">
        This reset link is invalid or has expired.<br /><br />
        <a href="forgot-password.html" style="color:#fff;text-decoration:underline;">Request a new one →</a>
      </div>

      <div id="rp-form-wrap">
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-sub">Choose a strong password for your account.</p>

        <div class="auth-error" id="rp-error"></div>
        <div class="auth-success" id="rp-success">
          Password updated! <a href="index.html" style="color:#4ade80;">Log in →</a>
        </div>

        <form id="rp-form" novalidate>
          <div class="auth-field">
            <label for="password">New password</label>
            <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required />
          </div>
          <div class="auth-field">
            <label for="password2">Confirm new password</label>
            <input type="password" id="password2" placeholder="Repeat password" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn btn-primary auth-btn" id="rp-btn">Update password</button>
        </form>
      </div>

      <p class="auth-footer">
        <a href="index.html">← Back to log in</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script>
  (function () {
    var cfg = window.LC_CONFIG;
    if (!cfg || cfg.supabaseUrl === 'YOUR_SUPABASE_URL') return;
    var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);

    var formWrap  = document.getElementById('rp-form-wrap');
    var invalid   = document.getElementById('rp-invalid');
    var form      = document.getElementById('rp-form');
    var errBox    = document.getElementById('rp-error');
    var okBox     = document.getElementById('rp-success');
    var btn       = document.getElementById('rp-btn');

    function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
    function hideErr()    { errBox.style.display = 'none'; }

    // Supabase puts the recovery token in the URL hash when the user
    // clicks the reset link in their email. getSession() exchanges it
    // automatically and establishes a session we can use to updateUser.
    sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      // Also check URL hash for type=recovery (Supabase v2 behaviour)
      var hash = window.location.hash;
      var isRecovery = hash.indexOf('type=recovery') !== -1;

      if (!session && !isRecovery) {
        formWrap.style.display = 'none';
        invalid.style.display  = 'block';
      }
    });

    // Supabase fires this event when it detects a RECOVERY token in the URL
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') {
        formWrap.style.display = 'block';
        invalid.style.display  = 'none';
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      hideErr();

      var pw  = document.getElementById('password').value;
      var pw2 = document.getElementById('password2').value;

      if (pw.length < 8)  { showErr('Password must be at least 8 characters.'); return; }
      if (pw !== pw2)     { showErr('Passwords do not match.'); return; }

      btn.textContent = 'Updating…';
      btn.disabled = true;

      sb.auth.updateUser({ password: pw }).then(function (res) {
        btn.textContent = 'Update password';
        btn.disabled = false;
        if (res.error) {
          showErr(res.error.message || 'Something went wrong. Please try again.');
        } else {
          form.style.display = 'none';
          okBox.style.display = 'block';
        }
      });
    });
  })();
  </script>

</body>
</html>
