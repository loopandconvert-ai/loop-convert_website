<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card { width: 100%; max-width: 420px; background: #111; border: 1px solid #1e1e1e; border-radius: 20px; padding: 2.5rem 2rem; }
    .logo { font-size: 1rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -.02em; display: block; margin-bottom: 2rem; }
    .logo span { color: #3b82f6; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: .35rem; letter-spacing: -.02em; }
    .sub { font-size: .875rem; color: #666; margin-bottom: 2rem; }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .75rem; font-weight: 600; color: #666; margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .08em; }
    input[type="password"] { width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 10px; padding: .75rem 1rem; font-size: .9rem; color: #fff; font-family: inherit; outline: none; transition: border-color .15s; }
    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #333; }
    .hint { font-size: .75rem; color: #444; margin-top: .35rem; }
    .btn { width: 100%; padding: .82rem; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: opacity .15s; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .error-box, .success-box {
      border-radius: 9px;
      padding: .75rem 1rem;
      font-size: .85rem;
      margin-bottom: 1.1rem;
      display: none;
    }
    .error-box   { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.25);  color: #f87171; }
    .success-box { background: rgba(34,197,94,.08);  border: 1px solid rgba(34,197,94,.25);  color: #4ade80; }
    .invalid-link { text-align: center; padding: 1rem 0; }
    .invalid-link p { color: #666; font-size: .9rem; line-height: 1.6; }
    .invalid-link a { color: #3b82f6; }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="logo">Loop <span>&amp;</span> Convert</a>

    <div id="invalid-state" class="invalid-link" style="display:none;">
      <h1 style="margin-bottom:.75rem;">Link expired</h1>
      <p>This password reset link is no longer valid.<br>
      <a href="forgot-password.html">Request a new one →</a></p>
    </div>

    <div id="form-state">
      <h1>Set new password</h1>
      <p class="sub">Choose a strong password for your account.</p>

      <div class="error-box"   id="err"></div>
      <div class="success-box" id="ok"></div>

      <form id="pw-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required />
          <p class="hint">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Update Password</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    var form       = document.getElementById('pw-form');
    var errBox     = document.getElementById('err');
    var okBox      = document.getElementById('ok');
    var btn        = document.getElementById('submit-btn');
    var formState  = document.getElementById('form-state');
    var invalidState = document.getElementById('invalid-state');

    // Supabase processes the hash automatically and fires onAuthStateChange
    LC_AUTH.supabase.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        // Valid token — form is already shown by default
      }
    });

    // If no hash at all, check session — if none show invalid
    LC_AUTH.supabase.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      // If we have no session AND there's no hash token, the link is invalid
      if (!session && !window.location.hash.includes('access_token')) {
        formState.style.display = 'none';
        invalidState.style.display = 'block';
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.style.display = 'none';
      okBox.style.display  = 'none';

      var pw  = document.getElementById('password').value;
      var pw2 = document.getElementById('confirm').value;

      if (pw.length < 8) {
        errBox.textContent = 'Password must be at least 8 characters.';
        errBox.style.display = 'block';
        return;
      }
      if (pw !== pw2) {
        errBox.textContent = 'Passwords do not match.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      var res = await LC_AUTH.updatePassword(pw);

      if (res.error) {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        errBox.textContent = res.error.message;
        errBox.style.display = 'block';
        return;
      }

      form.style.display = 'none';
      okBox.textContent = 'Password updated! Redirecting to your dashboard…';
      okBox.style.display = 'block';

      setTimeout(async function () {
        var profile = await LC_AUTH.getProfile();
        window.location.href = LC_AUTH.dashboardUrl(profile && profile.role);
      }, 1500);
    });
  </script>
</body>
</html>
