<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Chat — Loop &amp; Convert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    html { height: 100%; }
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .dash-nav { flex-shrink: 0; position: static; }
    .chat-layout { flex: 1; min-height: 0; }
    .chat-sidebar { width: 240px; }
  </style>
</head>
<body data-page="auth-required">

<nav class="dash-nav">
  <div class="dash-nav-inner">
    <a href="index.html" class="nav-logo">Loop <span>&</span> Convert</a>
    <div class="nav-links">
      <a href="#" id="back-link" class="nav-link">← Back to Report</a>
    </div>
    <div class="nav-right">
      <div>
        <div class="nav-user-name" id="nav-name"></div>
        <div class="nav-user-firm" id="nav-firm"></div>
      </div>
      <button class="btn-sign-out" id="sign-out-btn">Sign out</button>
    </div>
  </div>
</nav>

<!-- Contract info bar -->
<div class="chat-bar">
  <span class="chat-bar-title" id="contract-name">Loading…</span>
  <span id="risk-badge"></span>
</div>

<!-- Two-panel layout -->
<div class="chat-layout">

  <!-- Sidebar: conversation history -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-new">
      <button class="chat-new-btn" id="new-chat-btn" disabled>
        <span style="font-size:.9rem">＋</span> New conversation
      </button>
    </div>
    <div class="chat-session-list" id="session-list">
      <div class="chat-no-sessions">Loading history…</div>
    </div>
  </div>

  <!-- Main chat area -->
  <div class="chat-main" id="chat-main">
    <div class="chat-main-empty" id="chat-empty">
      <h4>Start a conversation</h4>
      <p>Click "New conversation" to ask your first question about this contract.</p>
    </div>
    <div class="chat-msgs" id="chat-msgs" style="display:none;padding:1.25rem 1.5rem"></div>
    <div class="chat-suggestions" id="suggestions" style="padding:0 1.5rem"></div>
    <div class="chat-foot" id="chat-foot" style="display:none">
      <textarea class="chat-input" id="chat-input" placeholder="Ask anything about this contract…" rows="1"></textarea>
      <button class="chat-send" id="send-btn" disabled>Send</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var sb          = window.LC_AUTH.supabase;
  var contractId  = new URLSearchParams(window.location.search).get('id');
  var sessionId   = null;
  var activeItem  = null;
  var isStreaming = false;

  var msgsEl    = document.getElementById('chat-msgs');
  var emptyEl   = document.getElementById('chat-empty');
  var footEl    = document.getElementById('chat-foot');
  var inputEl   = document.getElementById('chat-input');
  var sendBtn   = document.getElementById('send-btn');
  var listEl    = document.getElementById('session-list');
  var suggestEl = document.getElementById('suggestions');

  var SUGGESTIONS = [
    'What are the biggest risks?',
    'Summarize the payment terms.',
    'Is there an auto-renewal clause?',
    'What is the liability cap?',
    'Which clauses should I negotiate?'
  ];

  function timeAgo(iso) {
    var d    = new Date(iso);
    var diff = (Date.now() - d) / 1000;
    if (diff < 60)     return 'just now';
    if (diff < 3600)   return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400)  return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  function scrollBottom() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  // ── Markdown renderer ─────────────────────────────
  function renderMd(text) {
    var s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
    s = s.replace(/^&gt; ?(.*)$/gm,'<span style="display:block;border-left:3px solid rgba(255,255,255,.2);padding-left:.6rem;color:var(--text-2);font-style:italic;margin:.2rem 0">$1</span>');
    s = s.replace(/^- (.+)$/gm,'<span style="display:block;padding-left:.75rem">• $1</span>');
    s = s.replace(/\n/g,'<br>');
    return s;
  }

  // ── Bubbles ───────────────────────────────────────
  function addBubble(role, content) {
    var wrap   = document.createElement('div');
    wrap.className = 'chat-msg ' + role;
    var av  = document.createElement('div');
    av.className   = 'chat-avatar';
    av.textContent = role === 'user' ? 'You' : 'AI';
    var bub = document.createElement('div');
    bub.className  = 'chat-bubble';
    if (content === '__typing__') {
      bub.innerHTML = '<div class="chat-typing"><span></span><span></span><span></span></div>';
    } else if (role === 'assistant') {
      bub.innerHTML = renderMd(content);
    } else {
      bub.textContent = content;
    }
    wrap.appendChild(av); wrap.appendChild(bub);
    msgsEl.appendChild(wrap);
    scrollBottom();
    return bub;
  }

  // ── Suggestions chips ─────────────────────────────
  function showSuggestions() {
    suggestEl.innerHTML = SUGGESTIONS.map(function(q) {
      return '<button class="chat-chip" data-q="' + q.replace(/"/g,'&quot;') + '">' + q + '</button>';
    }).join('');
    suggestEl.querySelectorAll('.chat-chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        inputEl.value = this.dataset.q;
        suggestEl.innerHTML = '';
        sendMessage();
      });
    });
  }

  // ── Session list ──────────────────────────────────
  async function loadSessions() {
    var token = (await sb.auth.getSession()).data.session.access_token;
    var resp  = await fetch('/api/chat-history.js?contract_id=' + contractId, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    var data  = await resp.json();
    var sessions = data.sessions || [];
    renderSessions(sessions);
    return sessions;
  }

  function renderSessions(sessions) {
    if (!sessions.length) {
      listEl.innerHTML = '<div class="chat-no-sessions">No conversations yet.<br>Start one!</div>';
      return;
    }
    listEl.innerHTML = '';
    sessions.forEach(function(s) {
      listEl.appendChild(buildSessionItem(s));
    });
  }

  function buildSessionItem(s) {
    var item = document.createElement('div');
    item.className = 'chat-session-item' + (s.id === sessionId ? ' active' : '');
    item.dataset.id = s.id;
    item.innerHTML = '<div class="chat-session-title">' + escHtml(s.title) + '</div>'
      + '<div class="chat-session-time">' + timeAgo(s.updated_at) + '</div>'
      + '<button class="chat-session-del" title="Delete">✕</button>';
    item.addEventListener('click', function() { openSession(s.id, item); });
    item.querySelector('.chat-session-del').addEventListener('click', function(e) {
      e.stopPropagation();
      deleteSession(s.id, item);
    });
    return item;
  }

  async function deleteSession(id, item) {
    if (isStreaming) return;
    var token = (await sb.auth.getSession()).data.session.access_token;
    var resp = await fetch('/api/chat-history.js?session_id=' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) return;
    item.remove();
    if (!listEl.querySelector('.chat-session-item')) {
      listEl.innerHTML = '<div class="chat-no-sessions">No conversations yet.<br>Start one!</div>';
    }
    if (id === sessionId) {
      sessionId = null;
      msgsEl.innerHTML = '';
      msgsEl.style.display = 'none';
      footEl.style.display = 'none';
      suggestEl.innerHTML = '';
      emptyEl.style.display = 'flex';
    }
  }

  function markActive(item) {
    if (activeItem) activeItem.classList.remove('active');
    if (item) item.classList.add('active');
    activeItem = item;
  }

  function updateSessionTitle(id, title) {
    var item = listEl.querySelector('[data-id="' + id + '"]');
    if (item) item.querySelector('.chat-session-title').textContent = title;
  }

  // ── Open existing session ─────────────────────────
  async function openSession(id, itemEl) {
    if (isStreaming) return;
    sessionId = id;
    markActive(itemEl || listEl.querySelector('[data-id="' + id + '"]'));

    msgsEl.innerHTML = '';
    emptyEl.style.display  = 'none';
    msgsEl.style.display   = 'flex';
    msgsEl.style.flexDirection = 'column';
    footEl.style.display   = 'flex';
    suggestEl.innerHTML    = '';
    inputEl.disabled       = false;
    sendBtn.disabled       = true;
    inputEl.value          = '';

    // Load messages
    var token = (await sb.auth.getSession()).data.session.access_token;
    var resp  = await fetch('/api/chat-history.js?session_id=' + id, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    var data  = await resp.json();
    var msgs  = data.messages || [];

    if (!msgs.length) {
      addBubble('assistant', 'Hi! Ask me anything about this contract — I have the full analysis and contract text.');
      showSuggestions();
    } else {
      msgs.forEach(function(m) { addBubble(m.role, m.content); });
    }
    scrollBottom();
    inputEl.focus();
  }

  // ── New conversation ──────────────────────────────
  async function startNewSession() {
    if (isStreaming) return;
    var token = (await sb.auth.getSession()).data.session.access_token;
    var resp  = await fetch('/api/chat-history.js', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ contract_id: contractId })
    });
    var data = await resp.json();
    if (!data.session) return;

    // Prepend to session list
    var s    = data.session;
    var item = buildSessionItem(s);
    if (listEl.querySelector('.chat-no-sessions')) listEl.innerHTML = '';
    listEl.insertBefore(item, listEl.firstChild);

    openSession(s.id, item);
  }

  // ── Send message ──────────────────────────────────
  async function sendMessage() {
    var text = inputEl.value.trim();
    if (!text || isStreaming || !sessionId) return;

    isStreaming    = true;
    sendBtn.disabled = true;
    inputEl.value  = '';
    inputEl.style.height = 'auto';
    suggestEl.innerHTML  = '';

    addBubble('user', text);
    var aiBubble = addBubble('assistant', '__typing__');

    try {
      var token = (await sb.auth.getSession()).data.session.access_token;
      var resp  = await fetch('/api/chat.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });

      if (!resp.ok) {
        var e = await resp.json().catch(function(){ return {}; });
        throw new Error(e.error || 'Request failed');
      }

      var reader  = resp.body.getReader();
      var decoder = new TextDecoder();
      var aiText  = '';
      var buf     = '';
      var started = false;

      while (true) {
        var ch = await reader.read(); if (ch.done) break;
        buf += decoder.decode(ch.value, { stream: true });
        var parts = buf.split('\n\n'); buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (!line.startsWith('data: ')) continue;
          try {
            var json = JSON.parse(line.slice(6));
            if (json.error) throw new Error(json.error);
            if (json.title) updateSessionTitle(sessionId, json.title);
            if (json.done)  break;
            if (json.text) {
              if (!started) { aiBubble.textContent = ''; started = true; }
              aiText += json.text; aiBubble.innerHTML = renderMd(aiText); scrollBottom();
            }
          } catch(pe) { if (pe.message !== 'Unexpected end of JSON input') throw pe; }
        }
      }

    } catch(err) { aiBubble.textContent = 'Error: ' + err.message; }

    isStreaming    = false;
    sendBtn.disabled = !inputEl.value.trim();
    inputEl.focus();
  }

  // ── Input wiring ──────────────────────────────────
  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    sendBtn.disabled  = !this.value.trim() || isStreaming;
  });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);
  document.getElementById('new-chat-btn').addEventListener('click', startNewSession);

  function escHtml(s) {
    var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
  }

  // ── Init ─────────────────────────────────────────
  document.getElementById('sign-out-btn').addEventListener('click', function() { LC_AUTH.signOut(); });

  (async function init() {
    var session = await LC_AUTH.requireAuth();
    if (!session) return;
    var profile = await LC_AUTH.getProfile();
    if (!profile) return LC_AUTH.signOut();
    if (profile.status === 'disabled') { LC_AUTH.signOut(); return; }

    document.getElementById('nav-name').textContent = profile.full_name || profile.email;
    document.getElementById('nav-firm').textContent = profile.firms ? profile.firms.name : '';

    if (!contractId) {
      listEl.innerHTML = '<div class="chat-no-sessions">No contract selected.</div>'; return;
    }

    document.getElementById('back-link').href = 'analysis-report.html?id=' + contractId;

    // Load contract info for the bar
    var cRes = await sb.from('contracts')
      .select('id, file_name, analyses(overall_risk_score, risk_level)')
      .eq('id', contractId).maybeSingle();

    if (cRes.data) {
      var c = cRes.data;
      document.title = c.file_name + ' — Chat · Loop & Convert';
      document.getElementById('contract-name').textContent = c.file_name;
      var a = c.analyses && c.analyses[0];
      if (a) {
        var badge = document.getElementById('risk-badge');
        badge.className   = 'badge badge-' + a.risk_level;
        badge.textContent = 'Risk: ' + a.overall_risk_score + '/100';
      }
    }

    document.getElementById('new-chat-btn').disabled = false;

    var sessions = await loadSessions();

    // Auto-open most recent session if any
    if (sessions.length) {
      openSession(sessions[0].id);
    } else {
      emptyEl.style.display = 'flex';
    }
  })();
})();
</script>
</body>
</html>
